# Scrapes the backend and the ML service inside the compose network (profile `monitoring`).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]
  - job_name: ml-service
    static_configs:
      - targets: ["ml-service:8001"]
