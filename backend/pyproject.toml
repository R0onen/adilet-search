[project]
name = "adilet-backend"
version = "0.1.0"
description = "Adilet Search backend: public REST API, search/RAG orchestration, admin, indexer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "structlog>=24.4",
    "qdrant-client>=1.15",
    "numpy>=2.1",
    "pyarrow>=18",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = [
    "RUF001", # ambiguous unicode: Cyrillic/Kazakh text is intentional
    "RUF002",
    "RUF003",
    "N818",   # exception names like MlUnavailable read better without an Error suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"dev/sample_corpus.py" = ["E501"]  # data tables

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = false
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.services.*", "app.api.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs running postgres/qdrant/fake-ml (docker compose --profile dev up -d)",
    "ml: needs the real ml-service (opt-in)",
]
addopts = "-m 'not integration and not ml'"
filterwarnings = [
    # starlette's TestClient nudges towards httpx2; httpx is still supported.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
