# Dev stack. Quickstart:
#   cp .env.example .env
#   docker compose --profile dev up -d --build     # postgres, qdrant, fake-ml, migrate, backend
#   curl http://localhost:8000/api/v1/health
#
# Profiles:
#   dev  - fake ML service (contract-compliant, no models). Default ML_SERVICE_URL points to it.
#   ml   - the real ml-service (from ML's snippet). Use with ML_SERVICE_URL=http://ml-service:8001.
#   llm-cpu - a llama.cpp server for ml-service's `openai` generator mode (placeholder).

name: adilet

x-backend-image: &backend-image
  build:
    context: ./backend
    args:
      GIT_SHA: ${GIT_SHA:-dev}
  image: adilet-backend:dev

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  GIT_SHA: ${GIT_SHA:-dev}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-adilet}:${POSTGRES_PASSWORD:-adilet}@postgres:5432/${POSTGRES_DB:-adilet}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_ALIAS: ${QDRANT_ALIAS:-legal_chunks}
  QDRANT_TIMEOUT_S: ${QDRANT_TIMEOUT_S:-5}
  QDRANT_PREFER_GRPC: ${QDRANT_PREFER_GRPC:-true}
  QDRANT_GRPC_PORT: 6334
  ML_SERVICE_URL: ${ML_SERVICE_URL:-http://fake-ml:8001}
  ML_CONNECT_TIMEOUT_S: ${ML_CONNECT_TIMEOUT_S:-2}
  ML_TIMEOUT_S: ${ML_TIMEOUT_S:-10}
  MANIFEST_SOURCE: ${MANIFEST_SOURCE:-service}
  MODEL_MANIFEST_PATH: ${MODEL_MANIFEST_PATH:-/models/model_manifest.json}
  MANIFEST_RETRY_S: ${MANIFEST_RETRY_S:-30}
  HEALTH_TIMEOUT_S: ${HEALTH_TIMEOUT_S:-2}
  SEARCH_EMBED_TIMEOUT_S: ${SEARCH_EMBED_TIMEOUT_S:-2}
  SEARCH_RETRIEVE_TIMEOUT_S: ${SEARCH_RETRIEVE_TIMEOUT_S:-2}
  SEARCH_RERANK_TIMEOUT_S: ${SEARCH_RERANK_TIMEOUT_S:-1.5}
  SEARCH_RERANK_TOP_N: ${SEARCH_RERANK_TOP_N:-}
  INDEX_STATE_TTL_S: ${INDEX_STATE_TTL_S:-30}
  ANSWER_TIMEOUT_S: ${ANSWER_TIMEOUT_S:-90}
  ANSWER_MAX_TOKENS: ${ANSWER_MAX_TOKENS:-512}
  ANSWER_TEMPERATURE: ${ANSWER_TEMPERATURE:-0.1}
  SSE_PING_S: ${SSE_PING_S:-15}
  SESSION_SALT: ${SESSION_SALT:-dev-only-session-salt}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-in-production}
  JWT_TTL_S: ${JWT_TTL_S:-28800}
  RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH:-60}
  RATE_LIMIT_ANSWER: ${RATE_LIMIT_ANSWER:-10}
  RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5}
  API_KEYS: ${API_KEYS:-}
  BREAKER_FAILURES: ${BREAKER_FAILURES:-5}
  BREAKER_RESET_S: ${BREAKER_RESET_S:-20}
  CACHE_TTL_S: ${CACHE_TTL_S:-300}
  DATA_DIR: /data

services:
  postgres:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adilet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adilet}
      POSTGRES_DB: ${POSTGRES_DB:-adilet}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      # The image has no curl/wget: talk HTTP over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 &&
          grep -q "200 OK" <&3'
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend-image
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-image
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      # Corpus Parquet files for the indexer (ML publishes data/sample and data/processed).
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  fake-ml:
    <<: *backend-image
    profiles: ["dev"]
    restart: unless-stopped
    command: ["uvicorn", "dev.fake_ml.app:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    environment:
      FAKE_ML_DIM: ${FAKE_ML_DIM:-768}
      FAKE_ML_FAIL: ${FAKE_ML_FAIL:-}
      FAKE_ML_LATENCY_MS: ${FAKE_ML_LATENCY_MS:-0}
      FAKE_ML_TOKEN_DELAY_MS: ${FAKE_ML_TOKEN_DELAY_MS:-20}
    ports:
      - "127.0.0.1:${FAKE_ML_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/version', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- ML-owned services ---------------------------------------------------------------
  # From the ML snippet in docs/status/ml.md (2026-10-08). Contract: contracts/ml_service.md.
  # Run the stack against the real ml-service instead of the fake one:
  #   ML_SERVICE_URL=http://ml-service:8001 docker compose --profile ml up -d --build
  # (profiles `dev` and `ml` both publish host port 8001: use one or the other)
  ml-service:
    build:
      context: ./ml
      dockerfile: serving/Dockerfile
    image: adilet-ml-service:dev
    profiles: ["ml"]
    restart: unless-stopped
    environment:
      # The manifest selects the models. Default: the real pipeline (E5 + cross-encoder; the
      # weights, ~1.6 GB, download into the ml-model-cache volume on the first start).
      # /app/models/model_manifest.bootstrap.json runs offline stand-ins (tests, CI).
      MODEL_MANIFEST_PATH: ${ML_MODEL_MANIFEST_PATH:-/app/models/model_manifest.json}
      MODEL_PROMPT_PATH: /app/prompts/answer_v1.md
      MODEL_CACHE_DIR: /models
      ADILET_ML_BATCH_SIZE: ${ADILET_ML_BATCH_SIZE:-32}
      # Bound parallel model calls and CPU threads; inference must not block health/metrics.
      ADILET_ML_INFERENCE_WORKERS: ${ADILET_ML_INFERENCE_WORKERS:-2}
      OMP_NUM_THREADS: ${ADILET_ML_CPU_THREADS:-4}
      MKL_NUM_THREADS: ${ADILET_ML_CPU_THREADS:-4}
      # fallback (extractive, no LLM) | openai (calls LLM_BASE_URL)
      ADILET_ML_GENERATOR_MODE: ${ADILET_ML_GENERATOR_MODE:-fallback}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8002}
      LLM_MODEL: ${LLM_MODEL:-adilet-generator}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ml-model-cache:/models
    ports:
      - "127.0.0.1:${ML_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  # The CPU LLM (llama.cpp + GGUF) is not needed while ml-service runs its fallback generator.
  # Placeholder until ML publishes the llm snippet; its own profile keeps `--profile ml` light.
  llm:
    image: ${LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    profiles: ["llm-cpu"]
    restart: unless-stopped

  # --- monitoring (profile `monitoring`) -------------------------------------------------
  #   docker compose --profile ml --profile monitoring up -d
  # Prometheus: http://127.0.0.1:9090   Grafana: http://127.0.0.1:3000/grafana/
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Served under /grafana so a reverse proxy can route it next to the app.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/adilet.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  prometheus:
  grafana:
  pgdata:
  qdrant:
  ml-model-cache:
