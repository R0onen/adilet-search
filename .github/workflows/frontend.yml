name: frontend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/openapi.json"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: lint, tests, build, API types drift
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: generated API types match contracts/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
